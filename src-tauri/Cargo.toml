[package]
name = "r2share"
version = "0.1.1"
description = "r2share — Cloudflare R2 tray uploader"
edition = "2021"

[lib]
name = "r2share_lib"
crate-type = ["rlib"]

[[bin]]
name = "r2share"
path = "src/main.rs"

[[bin]]
name = "r2share-cli"
path = "src/bin/r2share_cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri            = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
serde            = { version = "1", features = ["derive"] }
serde_json       = "1"
tokio            = { version = "1", features = ["full"] }
aws-config       = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3       = "1"
aws-credential-types = { version = "1", features = ["hardcoded-credentials"] }
rusqlite         = { version = "0.31", features = ["bundled"] }
base64           = "0.22"
mime_guess       = "2"
rand             = "0.8"
fs2             = "0.4.3"
clap = { version = "4.6.7", features = ["derive", "env"] }
indicatif = "0.18.6"
notify = "6"
sha2 = "0.11.0"
hex = "0.4.3"
walkdir = "2.5.0"
async-trait = "0.1.92"

# Linux: native clipboard reads (WebKitGTK's own paste path segfaults)
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
